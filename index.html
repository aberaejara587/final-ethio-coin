<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Coin Reward</title>
    
    <script src="https://adsgram.ai/sdk/v1/adsgames.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #2c3e50, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 340px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .coin-icon {
            font-size: 70px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px #ffd700);
        }
        #coin-count {
            font-size: 55px;
            font-weight: 800;
            color: #ffd700;
            margin: 10px 0;
        }
        .ad-button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
        }
        .ad-button:active { transform: scale(0.95); }
        .ad-button:disabled { background: #555; cursor: not-allowed; }
        
        #status-msg {
            margin-top: 15px;
            font-size: 13px;
            color: #ff4757;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="coin-icon">🪙</div>
    <h2 id="coin-count">0</h2>
    <p style="opacity: 0.7;">Ethio Coins</p>
    
    <button class="ad-button" id="adBtn" onclick="watchAd()">
        📺 BE EKSISA ILAALI
    </button>
    <div id="status-msg"></div>
</div>

<script>
    // Telegram expand
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    let coins = 0;
    const btn = document.getElementById('adBtn');
    const coinDisplay = document.getElementById('coin-count');
    const statusMsg = document.getElementById('status-msg');

    // Adsgram Initialize - Block ID KEETIIN
    const AdController = window.Adsgram.init({ 
        blockId: "24893", 
        debug: false // Beeksisa dhugaa fiduuf false ta'uu qaba
    });

    async function watchAd() {
        statusMsg.innerText = "Beeksisa barbaadaa jira...";
        btn.disabled = true;

        try {
            // Beeksisa agarsiisuu
            const result = await AdController.show();
            
            // Yoo milkaa'e (result.done == true)
            if (result && result.done) {
                coins += 100;
                coinDisplay.innerText = coins;
                statusMsg.style.color = "#2ed573";
                statusMsg.innerText = "Milkaa'inaan xumurame! +100";
                if (tg) tg.HapticFeedback.notificationOccurred('success');
            }
        } catch (err) {
            console.error(err);
            statusMsg.style.color = "#ff4757";
            
            // Error adda addaa kantirolii gochuuf
            if (err.error === 'not_found' || err.error === 'no_fill') {
                statusMsg.innerText = "Beeksiisni amma hin jiru, daqiiqaa muraasa booda yaali.";
            } else if (err.error === 'closed') {
                statusMsg.innerText = "Beeksisa osoo hin xumurin cufte!";
            } else {
                statusMsg.innerText = "Rakkoon uumame, deebisii yaali.";
            }
        } finally {
            setTimeout(() => {
                btn.disabled = false;
                if(statusMsg.innerText !== "Milkaa'inaan xumurame! +100") {
                    statusMsg.innerText = "";
                }
            }, 3000);
        }
    }
</script>

</body>
</html>
