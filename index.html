<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Coin · PRO</title>
    
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #05080d;
            --accent-gold: #e5b12e;
            --glass-bg: rgba(14, 22, 35, 0.65);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-void);
            color: white;
            min-height: 100vh;
        }
        .glass-premium {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #d4a41a 100%);
            color: #0a0f18;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            padding: 1.25rem;
            border-radius: 1rem;
            transition: all 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }
        .page { display: none; padding: 100px 20px; }
        .page.active { display: block; }
        
        /* Bottom Nav */
        .nav-glass {
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #64748b; text-align: center; flex: 1; }
        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full z-50 p-5 bg-black/40 backdrop-blur-md border-b border-white/5">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl">Ethio Coin</h1>
            <div class="flex items-baseline gap-1">
                <span id="total-balance" class="text-2xl font-bold text-amber-400">0</span>
                <span class="text-xs font-bold">ETC</span>
            </div>
        </div>
    </header>

    <main>
        <section id="page-home" class="page active">
            <div class="max-w-lg mx-auto glass-premium p-8 text-center">
                <h2 class="text-2xl font-bold mb-2">Baga Nagaan Dhufte!</h2>
                <p class="text-slate-400">Maallaqa sassaabbachuuf "Ads" banni.</p>
            </div>
        </section>

        <section id="page-watch" class="page">
            <div class="max-w-lg mx-auto glass-premium p-8 text-center">
                <div class="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg>
                </div>
                <h3 class="text-xl font-bold mb-2 text-white">Beeksisa Ilaali</h3>
                <p class="text-slate-400 mb-8 text-sm">Beeksisa tokkoof 100 ETC argadhu</p>
                
                <button id="adBtn" class="btn-primary w-full">BEEKSISA JALQABI</button>
                <p id="status-msg" class="mt-4 text-sm font-semibold h-5"></p>
            </div>
        </section>
    </main>

    <nav class="nav-glass fixed bottom-0 w-full py-4 px-2 flex justify-around">
        <button onclick="showPage('home')" class="nav-item active" id="nav-home">Home</button>
        <button onclick="showPage('watch')" class="nav-item" id="nav-watch">Ads</button>
        <button class="nav-item opacity-50">Wallet</button>
    </nav>

    <script>
        let coins = parseFloat(localStorage.getItem('user_coins')) || 0;
        let AdController = null;

        // Balance Update Godhuuf
        function updateBalance() {
            document.getElementById('total-balance').innerText = coins.toLocaleString();
            localStorage.setItem('user_coins', coins);
        }

        // Adsgram Init - Dhugaa (Real) gochuuf debug: false godhi
        function initAdsgram() {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({
                    blockId: "24893", 
                    debug: false // ASITTI: Beeksisa dhugaa fiduuf 'false' ta'uu qaba
                });
            }
        }

        // Beeksisa Agarsiisuuf
        async function runAd() {
            const btn = document.getElementById('adBtn');
            const status = document.getElementById('status-msg');

            if (!AdController) initAdsgram();
            if (!AdController) return;

            btn.disabled = true;
            status.innerText = "Beeksisa fidaa jira...";
            status.style.color = "#e5b12e";

            try {
                const result = await AdController.show();
                if (result.done) {
                    coins += 100;
                    updateBalance();
                    status.innerText = "Gariidha! +100 ETC";
                    status.style.color = "#34d399";
                }
            } catch (err) {
                status.innerText = "Beeksisi dhabameera, deebii yaali.";
                status.style.color = "#fb7185";
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    status.innerText = "";
                }, 3000);
            }
        }

        // Page Switcher
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
        }

        document.getElementById('adBtn').onclick = runAd;
        window.onload = () => {
            updateBalance();
            initAdsgram();
        };
    </script>
</body>
</html>
