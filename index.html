 <!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Coin Reward Pro</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #fbbf24; }
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; }
        .page.active { display: block; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <div class="fixed top-0 w-full glass z-50 p-4 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🪙</span>
            <span class="font-bold text-gray-400">Balance</span>
        </div>
        <div class="text-2xl font-black text-yellow-400" id="total-balance">0.00</div>
    </div>

    <div id="home" class="page active p-6 pt-24">
        <div class="glass rounded-3xl p-8 text-center mt-4">
            <h1 class="text-3xl font-extrabold mb-2">Baga Nagaan Dhufte!</h1>
            <p class="text-gray-400 text-sm">Beeksisa ilaalaa maallaqa sassaabbadhu.</p>
            <div class="mt-8 grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl">
                    <p class="text-xs text-gray-500 uppercase">Ads Today</p>
                    <p class="text-xl font-bold" id="ads-count">0</p>
                </div>
                <div class="glass p-4 rounded-2xl">
                    <p class="text-xs text-gray-500 uppercase">Status</p>
                    <p class="text-xl font-bold text-green-500">Active</p>
                </div>
            </div>
        </div>
    </div>
    <div id="watch" class="page p-6 pt-24">
        <h2 class="text-xl font-bold mb-4">Video Rewards</h2>
        <div class="glass rounded-3xl p-10 text-center border-t-4 border-yellow-500">
            <div class="text-6xl mb-4">📺</div>
            <h3 class="text-2xl font-bold mb-2">Watch & Earn</h3>
            <p class="text-gray-400 mb-6 text-sm">Beeksisa tokkoof 100 Coins argatta.</p>
            <button onclick="watchAd()" id="adBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-4 rounded-2xl transition-all active:scale-95">
                SHOW VIDEO AD
            </button>
            <p id="status-msg" class="mt-4 text-xs font-semibold h-4"></p>
        </div>
    </div>

    <div id="invite" class="page p-6 pt-24">
        <h2 class="text-xl font-bold mb-4">Referrals</h2>
        <div class="glass rounded-3xl p-8 text-center">
            <div class="text-5xl mb-4">🎁</div>
            <p class="text-gray-300 mb-6">Hiriyaa kee affeeruun 500 Coins argadhu.</p>
            <button onclick="copyInvite()" class="w-full border border-yellow-500/50 text-yellow-500 py-4 rounded-2xl font-bold mb-3">Copy Invite Link</button>
            <button onclick="shareInvite()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">Share on Telegram</button>
        </div>
    </div>

    <div id="wallet" class="page p-6 pt-24">
        <h2 class="text-xl font-bold mb-4">Withdrawal</h2>
        <div class="glass rounded-3xl p-6 space-y-6">
            <div>
                <label class="text-xs text-gray-500 uppercase font-bold mb-2 block">TON Wallet Address</label>
                <input type="text" placeholder="UQ... or Wallet ID" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:outline-none focus:border-yellow-500">
            </div>
            <div class="p-4 bg-yellow-500/10 rounded-2xl border border-yellow-500/20">
                <p class="text-xs text-yellow-500 font-bold uppercase">Minimum Withdrawal</p>
                <p class="text-lg font-black">10,000 Coins ($10.00)</p>
            </div>
            <button onclick="alert('Kaffaltiin kan jalqabu yoo 10,000 geessaniidha!')" class="w-full bg-white text-black font-black py-4 rounded-2xl opacity-50">WITHDRAW NOW</button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full glass border-t border-white/10 px-6 py-4 flex justify-between items-center z-50">
        <button onclick="showPage('home', this)" class="nav-item active flex flex-col items-center gap-1">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button onclick="showPage('watch', this)" class="nav-item flex flex-col items-center gap-1">
            <span class="text-xl">📺</span>
            <span class="text-[10px] font-bold">Ads</span>
        </button>
        <button onclick="showPage('invite', this)" class="nav-item flex flex-col items-center gap-1">
            <span class="text-xl">🎁</span>
            <span class="text-[10px] font-bold">Invite</span>
        </button>
        <button onclick="showPage('wallet', this)" class="nav-item flex flex-col items-center gap-1">
            <span class="text-xl">👛</span>
            <span class="text-[10px] font-bold">Wallet</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // LocalStorage fayyadamnee balance kuusuu
        let coins = parseFloat(localStorage.getItem('user_coins')) || 0;
        let adCount = parseInt(localStorage.getItem('ad_count')) || 0;

        function updateDisplay() {
            document.getElementById('total-balance').innerText = coins.toLocaleString();
            document.getElementById('ads-count').innerText = adCount;
            localStorage.setItem('user_coins', coins);
            localStorage.setItem('ad_count', adCount);
        }

        updateDisplay(); // Page yeroo reload ta'u deebisee fida

        // Page Switching Logic
        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        // Adsgram Logic
        const AdController = window.Adsgram.init({ blockId: "24893", debug: false });

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            const statusMsg = document.getElementById('status-msg');
            btn.disabled = true;
            statusMsg.innerText = "Loading ad...";

            try {
                const result = await AdController.show();
                if (result && result.done) {
                    coins += 100;
                    adCount += 1;
                    updateDisplay();
                    statusMsg.style.color = "#22c55e";
                    statusMsg.innerText = "Baga gammadde! +100 Coins";
                    if (tg) tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (e) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Ads not available right now.";
            } finally {
                setTimeout(() => { btn.disabled = false; statusMsg.innerText = ""; }, 3000);
            }
        }

        function copyInvite() {
            alert("Invite link copied!");
        }

        function shareInvite() {
            if (tg) tg.openTelegramLink("https://t.me/share/url?url=https://t.me/Ethio_Coin1_bot&text=Kootu maallaqa waliin hojjennu!");
        }
    </script>
</body>
</html>
