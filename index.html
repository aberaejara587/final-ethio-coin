<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Coin · PRO</title>
    
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js" defer></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-void: #05080d;
            --glass-bg: rgba(14, 22, 35, 0.65);
            --accent-gold: #e5b12e;
        }
        body { font-family: sans-serif; background: var(--bg-void); color: white; min-height: 100vh; }
        .glass-premium { background: var(--glass-bg); backdrop-filter: blur(20px); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background: var(--accent-gold); color: black; font-weight: bold; padding: 1rem; border-radius: 1rem; width: 100%; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .page { display: none; padding: 80px 20px; }
        .active { display: block; }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full p-5 flex justify-between items-center z-50 bg-black/50">
        <div class="font-bold text-xl">Ethio Coin <span id="total-balance" class="text-amber-400">0</span> <small class="text-xs">ETC</small></div>
    </header>

    <main>
        <section id="page-watch" class="page active">
            <div class="glass-premium p-10 text-center">
                <div class="text-5xl mb-5">📺</div>
                <h3 class="text-xl font-bold mb-2">Beeksisa Ilaali</h3>
                <p class="text-gray-400 mb-8">Beeksisa tokkoon 100 ETC argadhu</p>
                
                <button id="adBtn" class="btn-primary">ADS JALQABI</button>
                <div id="status-msg" class="status-msg"></div>
            </div>
        </section>
    </main>

    <script>
        let coins = parseFloat(localStorage.getItem('user_coins')) || 0;
        let AdController = null;

        // 1. SDK akka fe'ame mirkaneessuuf
        function setupAds() {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({
                    blockId: "24893", 
                    debug: true // Jalqaba irratti Test Ad akka dhufuuf TRUE dha. Sana booda FALSE godhuu dandeessa.
                });
                console.log("Adsgram Ready!");
            } else {
                console.log("Waiting for SDK...");
                setTimeout(setupAds, 1000); // Yoo fe'amee hin xumurre yeroo 1s booda irra deebi'a
            }
        }

        async function showAd() {
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('adBtn');

            if (!AdController) {
                status.innerText = "Beeksisi hin qophoofne, daqiiqaa tokko eegi...";
                status.style.color = "red";
                setupAds();
                return;
            }

            btn.disabled = true;
            status.innerText = "Beeksisa fidaa jira...";
            status.style.color = "#22d3ee";

            try {
                const result = await AdController.show();
                if (result.done) {
                    coins += 100;
                    document.getElementById('total-balance').innerText = coins.toLocaleString();
                    localStorage.setItem('user_coins', coins);
                    status.innerText = "Gariidha! +100 ETC";
                    status.style.color = "#34d399";
                }
            } catch (e) {
                status.innerText = "Hammaaf beeksisi dhabameera.";
                status.style.color = "red";
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    status.innerText = "";
                }, 3000);
            }
        }

        document.getElementById('adBtn').onclick = showAd;
        document.getElementById('total-balance').innerText = coins.toLocaleString();
        
        // SDK jalqaba irratti waami
        setupAds();
    </script>
</body>
</html>
