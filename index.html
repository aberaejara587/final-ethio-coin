<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethio Coin</title>

<script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#0b0f19;
color:white;
font-family:sans-serif;
}

.page{display:none}
.page.active{display:block}

.btn{
background:#e5b12e;
padding:15px;
border-radius:12px;
font-weight:bold;
width:100%;
}

</style>
</head>

<body class="p-4">

<h1 class="text-2xl mb-4">Ethio Coin</h1>

<div class="mb-6">
Balance: <span id="balance">0</span> ETC
</div>

<div class="mb-6">
Ads watched: <span id="ads">0</span>
</div>

<button id="watchAd" class="btn">Watch Ad</button>

<p id="status" class="mt-4"></p>

<script>

let coins = Number(localStorage.getItem("coins")) || 0
let ads = Number(localStorage.getItem("ads")) || 0

const tg = window.Telegram?.WebApp
let AdController = null

const balanceEl = document.getElementById("balance")
const adsEl = document.getElementById("ads")
const statusEl = document.getElementById("status")
const adBtn = document.getElementById("watchAd")


/* Telegram */

if(tg){
tg.ready()
tg.expand()
}


/* Display */

function update(){

balanceEl.textContent = coins
adsEl.textContent = ads

localStorage.setItem("coins",coins)
localStorage.setItem("ads",ads)

}

update()


/* Init Adsgram */

function initAds(){

if(!window.Adsgram){
console.log("Adsgram not loaded")
return
}

AdController = window.Adsgram.init({

blockId:"YOUR_BLOCK_ID",
debug:false

})

console.log("Adsgram ready")

}

window.addEventListener("load",()=>{

setTimeout(initAds,500)

})


/* Status */

function status(msg,color){

statusEl.innerText=msg
statusEl.style.color=color

}


/* Watch Ad */

async function watchAd(){

if(!tg){

status("Open inside Telegram","#ff4d4d")
return

}

if(!AdController){

initAds()

if(!AdController){

status("Ad system loading","#ff4d4d")
return

}

}

adBtn.disabled=true

status("Loading ad...","#00eaff")

try{

const result = await AdController.show()

if(result.done){

coins += 100
ads += 1

update()

status("Reward +100 ETC","#00ff99")

tg.HapticFeedback?.notificationOccurred("success")

}else{

status("Ad skipped","#ffaa00")

}

}catch(e){

console.log(e)

status("No ads available","#ff4d4d")

}

setTimeout(()=>{

adBtn.disabled=false
status("","")

},2500)

}

adBtn.addEventListener("click",watchAd)

</script>

</body>
</html>
