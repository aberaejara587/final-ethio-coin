<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Coin Reward - Adsgram</title>
    
    <script src="https://adsgram.ai/sdk/v1/adsgames.js"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .coin-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 15px #ffd700);
            animation: bounce 2s infinite;
            margin-bottom: 10px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h2 { font-weight: 300; margin-bottom: 5px; }
        
        #coin-count {
            font-size: 50px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
        }

        .reward-info {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .ad-button {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .ad-button:hover {
            transform: scale(1.03);
            background: #fff;
        }

        .ad-button:active {
            transform: scale(0.97);
        }

        .ad-button:disabled {
            background: #666;
            color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="coin-icon">🪙</div>
    <h2 id="coin-count">0</h2>
    <p class="reward-info">Ethio Coins Galmeeffame</p>
    
    <button class="ad-button" id="adBtn" onclick="watchAd()">
        <span class="loader" id="loader"></span>
        <span id="btnText">📺 Beeksisa Ilaali (+100)</span>
    </button>

    <p class="footer-text">Powered by Adsgram • Block ID: 24893</p>
</div>

<script>
    // Telegram WebApp expand gochuuf
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    let coins = 0;
    const btn = document.getElementById('adBtn');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btnText');
    const coinDisplay = document.getElementById('coin-count');

    // Adsgram Initialize - Block ID 24893
    // Debug Mode: true godheera akka beeksiisni akka fidu gargaaruuf
    const AdController = window.Adsgram.init({ 
        blockId: "24893",
        debug: true 
    });

    async function watchAd() {
        // Button disable godhi
        btn.disabled = true;
        loader.style.display = "inline-block";
        btnText.innerText = "Loading Ad...";

        try {
            // Beeksisa waamuu
            const result = await AdController.show();
            
            if (result.done) {
                // Yoo xumurame badhaasa kenni
                coins += 100;
                coinDisplay.innerText = coins;
                alert("Baay'ee gaari! Badhaasa kee +100 Coins argatteetta. ✅");
            }
        } catch (err) {
            console.error("Adsgram error details:", err);
            
            if (err.error === 'not_found') {
                alert("Beeksiisni amma dhiyaachuu hin dandeenye. Maaloo booda yaali.");
            } else if (err.error === 'render_failed') {
                alert("Beeksisa fiduu irratti rakkoon uumame.");
            } else {
                alert("Beeksisa ilaaltee hin xumurre! ⚠️");
            }
        } finally {
            // Button deebisii banu
            btn.disabled = false;
            loader.style.display = "none";
            btnText.innerText = "📺 Beeksisa Ilaali (+100)";
        }
    }
</script>

</body>
</html>
