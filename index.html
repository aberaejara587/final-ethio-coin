<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Coin Reward Pro - Bubble Edition</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24;
            --secondary: #ec4899; /* Pink */
            --accent: #8b5cf6;    /* Purple */
            --bg-dark: #08080a;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            overflow: hidden;
            margin: 0;
        }

        /* --- Bubble Background Logic --- */
        .bubbles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(180deg, #08080a 0%, #1a1a2e 100%);
        }
        .bubble {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: rgba(251, 191, 36, 0.1);
            border-radius: 50%;
            opacity: 0.5;
            animation: rise 15s infinite ease-in;
        }
        .bubble:nth-child(2) { width: 80px; height: 80px; left: 20%; animation-duration: 10s; background: rgba(236, 72, 153, 0.1); }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 50%; animation-duration: 12s; background: rgba(139, 92, 246, 0.1); }
        .bubble:nth-child(4) { width: 120px; height: 120px; left: 80%; animation-duration: 18s; background: rgba(59, 130, 246, 0.1); }
        
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateY(-1000px) scale(1.5); opacity: 0; }
        }

        /* --- Glass Cards --- */
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 120px; animation: slideUp 0.5s ease; }
        .page.active { display: block; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-main {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            border: none;
            color: #000;
            font-weight: 800;
            transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.95); }

        .nav-active { color: #fbbf24 !important; filter: drop-shadow(0 0 8px #fbbf24); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="fixed top-0 w-full z-50 p-6 flex justify-between items-center">
        <div class="glass-card px-5 py-2 flex items-center gap-3">
            <span class="text-xl">💰</span>
            <span class="text-xl font-black text-white" id="total-balance">0.00</span>
        </div>
        <div class="w-12 h-12 glass-card rounded-full flex items-center justify-center border-yellow-500/30">
            <span class="text-xl">🏆</span>
        </div>
    </div>

    <div id="home" class="page active p-6 pt-28">
        <div class="glass-card p-8 text-center border-t border-white/20">
            <div class="w-20 h-20 bg-yellow-500/20 rounded-full mx-auto mb-4 flex items-center justify-center">
                <span class="text-4xl">👋</span>
            </div>
            <h1 class="text-3xl font-black mb-2">Akkam <span class="text-yellow-400 text-shadow">Nagayaa?</span></h1>
            <p class="text-gray-400 text-sm">Har'a hamma dandeessu sassaabadhu!</p>
            
            <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="glass-card p-4 bg-white/5">
                    <p class="text-[10px] uppercase text-gray-500 font-bold">Ads</p>
                    <p class="text-2xl font-black text-yellow-400" id="ads-count">0</p>
                </div>
                <div class="glass-card p-4 bg-white/5">
                    <p class="text-[10px] uppercase text-gray-500 font-bold">Level</p>
                    <p class="text-2xl font-black text-blue-400">Starter</p>
                </div>
            </div>
        </div>
    </div>

    <div id="watch" class="page p-6 pt-28">
        <div class="glass-card p-10 text-center relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-500/10 rounded-full blur-3xl"></div>
            <div class="text-7xl mb-6">📺</div>
            <h2 class="text-2xl font-black mb-2">Reward Video</h2>
            <p class="text-gray-400 text-sm mb-8">Video tokkoof 100 Coins argatta.</p>
            <button onclick="watchAd()" id="adBtn" class="w-full btn-main py-5 rounded-2xl text-lg uppercase tracking-widest">
                START EARNING
            </button>
            <p id="status-msg" class="mt-4 text-sm font-bold min-h-[20px]"></p>
        </div>
    </div>

    <div id="invite" class="page p-6 pt-28">
        <div class="glass-card p-8 text-center">
            <div class="text-6xl mb-6">🎁</div>
            <h2 class="text-2xl font-black mb-2">Refer & Earn</h2>
            <p class="text-gray-400 mb-8">Hiriyaa tokkoof 500 Coins!</p>
            <div class="space-y-4">
                <button onclick="copyInvite()" class="w-full py-4 rounded-2xl border-2 border-white/10 font-bold hover:bg-white/5 transition">Copy Link</button>
                <button onclick="shareInvite()" class="w-full py-4 rounded-2xl bg-[#0088cc] font-bold shadow-lg shadow-blue-500/20">Telegram Share</button>
            </div>
        </div>
    </div>

    <div id="wallet" class="page p-6 pt-28">
        <div class="glass-card p-6">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2">
                <span class="text-2xl">👛</span> Withdraw Funds
            </h2>
            <div class="space-y-6">
                <input type="text" placeholder="TON Wallet (UQ...)" class="w-full bg-black/50 border border-white/10 rounded-2xl p-5 focus:outline-none focus:border-yellow-500">
                <div class="p-5 rounded-2xl bg-gradient-to-br from-yellow-500/10 to-purple-500/10 border border-white/5">
                    <p class="text-xs text-gray-500 uppercase font-black mb-1">Threshold</p>
                    <p class="text-xl font-black">10,000 Coins</p>
                </div>
                <button class="w-full py-5 rounded-2xl bg-white/5 text-gray-500 font-black cursor-not-allowed">CASH OUT</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-6 left-6 right-6 z-50">
        <div class="glass-card px-8 py-5 flex justify-between items-center border-white/20">
            <button onclick="showPage('home', this)" class="nav-item nav-active flex flex-col items-center">
                <span class="text-xl">🏠</span>
            </button>
            <button onclick="showPage('watch', this)" class="nav-item flex flex-col items-center">
                <span class="text-xl">⚡</span>
            </button>
            <button onclick="showPage('invite', this)" class="nav-item flex flex-col items-center">
                <span class="text-xl">🎁</span>
            </button>
            <button onclick="showPage('wallet', this)" class="nav-item flex flex-col items-center">
                <span class="text-xl">⚙️</span>
            </button>
        </div>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let coins = parseFloat(localStorage.getItem('user_coins')) || 0;
        let adCount = parseInt(localStorage.getItem('ad_count')) || 0;

        function updateDisplay() {
            document.getElementById('total-balance').innerText = coins.toLocaleString();
            document.getElementById('ads-count').innerText = adCount;
            localStorage.setItem('user_coins', coins);
            localStorage.setItem('ad_count', adCount);
        }
        updateDisplay();

        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            element.classList.add('nav-active');
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        const AdController = window.Adsgram.init({ blockId: "24893", debug: false });

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            const statusMsg = document.getElementById('status-msg');
            btn.disabled = true;
            statusMsg.innerText = "Beeksisa fidaa jira...";
            statusMsg.style.color = "#fbbf24";

            try {
                const result = await AdController.show();
                if (result && result.done) {
                    coins += 100; adCount += 1;
                    updateDisplay();
                    statusMsg.style.color = "#4ade80";
                    statusMsg.innerText = "Milkaa'eera! +100 Coins";
                    if (tg) tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (e) {
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "Beeksisi hin jiru.";
            } finally {
                setTimeout(() => { btn.disabled = false; statusMsg.innerText = ""; }, 3000);
            }
        }

        function copyInvite() { alert("Linkiin garagalfameera!"); }
        function shareInvite() { if (tg) tg.openTelegramLink("https://t.me/share/url?url=https://t.me/Ethio_Coin1_bot"); }
    </script>
</body>
</html>
