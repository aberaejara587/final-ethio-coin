<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Coin · PRO</title>
    
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #05080d;
            --accent-gold: #e5b12e;
            --glass-bg: rgba(14, 22, 35, 0.65);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-void);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-premium {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #d4a41a 100%);
            color: #0a0f18;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            padding: 1.25rem;
            border-radius: 1rem;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(229, 177, 46, 0.2);
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .page { display: none; padding: 100px 20px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-glass {
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #64748b; font-size: 0.75rem; font-weight: bold; background: transparent; border: none; cursor: pointer; }
        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body class="bg-[#05080d]">

    <header class="fixed top-0 w-full z-50 p-5 bg-black/40 backdrop-blur-md border-b border-white/5">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center text-amber-400 font-bold">E</div>
                <span class="font-bold tracking-tight">Ethio Coin</span>
            </div>
            <div class="flex items-baseline gap-1 bg-white/5 px-3 py-1 rounded-full border border-white/10">
                <span id="total-balance" class="text-xl font-bold text-amber-400">0</span>
                <span class="text-[10px] font-bold text-slate-400 uppercase">ETC</span>
            </div>
        </div>
    </header>

    <main class="pb-32">
        <section id="page-home" class="page active">
            <div class="max-w-lg mx-auto glass-premium p-8 text-center">
                <h2 class="text-2xl font-bold mb-3">Baga Nagaan Dhufte!</h2>
                <p class="text-slate-400 text-sm">Beeksisa ilaaluun ETC sassaabbadhu.</p>
            </div>
        </section>

        <section id="page-watch" class="page">
            <div class="max-w-lg mx-auto glass-premium p-10 text-center relative overflow-hidden">
                <div class="w-24 h-24 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border border-amber-500/20">
                    <svg class="w-12 h-12 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/>
                    </svg>
                </div>
                
                <h3 class="text-2xl font-bold mb-2">Beeksisa Ilaali</h3>
                <p class="text-slate-400 mb-10 text-sm">Beeksisa tokkoof <span class="text-amber-400 font-bold">100 ETC</span> argadhu</p>
                
                <button id="adBtn" class="btn-primary w-full uppercase tracking-widest text-sm">
                    Beeksisa Jalqabi
                </button>
                
                <p id="status-msg" class="mt-6 text-sm font-semibold min-h-[1.25rem] transition-all"></p>
            </div>
        </section>

        <section id="page-wallet" class="page">
            <div class="max-w-lg mx-auto glass-premium p-8 text-center">
                <h3 class="text-xl font-bold mb-4">Wallet Kee</h3>
                <p class="text-slate-500 text-sm italic">Withdrawals soon...</p>
            </div>
        </section>
    </main>

    <nav class="nav-glass fixed bottom-0 w-full py-4 px-4 flex justify-around z-50">
        <button onclick="showPage('home')" class="nav-item active" id="nav-home">
            <span class="block text-lg mb-1">🏠</span> HOME
        </button>
        <button onclick="showPage('watch')" class="nav-item" id="nav-watch">
            <span class="block text-lg mb-1">🎬</span> ADS
        </button>
        <button onclick="showPage('wallet')" class="nav-item" id="nav-wallet">
            <span class="block text-lg mb-1">💰</span> WALLET
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = parseFloat(localStorage.getItem('user_coins')) || 0;
        let AdController = null;

        function updateBalance() {
            document.getElementById('total-balance').innerText = coins.toLocaleString();
            localStorage.setItem('user_coins', coins);
        }

        // --- SIRREEFFAMA ADSGRAM ---
        function initAdsgram() {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ 
                    blockId: "24893",
                    debug: true // JALQABA IRRATTI TRUE GODHIITII YAALI
                });
            } else {
                console.error("Adsgram SDK not found");
            }
        }

        async function runAd() {
            const btn = document.getElementById('adBtn');
            const status = document.getElementById('status-msg');

            if (!AdController) initAdsgram();
            if (!AdController) {
                status.innerText = "Ad system not loaded!";
                return;
            }

            btn.disabled = true;
            status.innerText = "Beeksisa fidaa jira...";
            status.style.color = "#e5b12e";

            AdController.show().then((result) => {
                // SUCCESS
                coins += 100;
                updateBalance();
                status.innerText = "Gariidha! +100 ETC argatteetta.";
                status.style.color = "#34d399";
                tg.HapticFeedback.notificationOccurred('success');
            }).catch((result) => {
                // ERROR HANDLING - SIRREEFFAME
                console.log("Adsgram Info:", result);
                
                if (result.error) {
                    // Dogoggora jiru asitti sitti hima
                    status.innerText = "Error: " + (result.description || "Beeksisi dhabame");
                } else {
                    status.innerText = "Beeksisa dhiisteetta (Skipped)!";
                }
                status.style.color = "#fb7185";
                tg.HapticFeedback.notificationOccurred('error');
            }).finally(() => {
                setTimeout(() => {
                    btn.disabled = false;
                    status.innerText = "";
                }, 4000);
            });
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
        }

        document.getElementById('adBtn').onclick = runAd;

        window.onload = () => {
            updateBalance();
            initAdsgram();
        };
    </script>
</body>
</html>
