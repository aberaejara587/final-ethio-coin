<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Coin Reward</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Stylen kee bareedaa dha, hin jijjiirini */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #2c3e50, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 340px;
        }
        #coin-count {
            font-size: 55px;
            font-weight: 800;
            color: #ffd700;
        }
        .ad-button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        #status-msg { margin-top: 15px; font-size: 13px; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size: 70px;">🪙</div>
    <h2 id="coin-count">0</h2>
    <p style="opacity: 0.7;">Ethio Coins</p>
    
    <button class="ad-button" id="adBtn" onclick="watchAd()">
        📺 BEEKSISA ILAALI
    </button>
    <div id="status-msg"></div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    let coins = 0;
    const btn = document.getElementById('adBtn');
    const coinDisplay = document.getElementById('coin-count');
    const statusMsg = document.getElementById('status-msg');

    // Adsgram Initialize
    // BLOCK ID KEE "24893" TA'UU MIRKANEEFFADHU
    const AdController = window.Adsgram.init({ 
        blockId: "24893", 
        debug: false 
    });

    async function watchAd() {
        statusMsg.style.color = "white";
        statusMsg.innerText = "Beeksisa barbaadaa jira...";
        btn.disabled = true;

        try {
            const result = await AdController.show();
            
            if (result && result.done) {
                coins += 100;
                coinDisplay.innerText = coins;
                statusMsg.style.color = "#2ed573";
                statusMsg.innerText = "Milkaa'inaan xumurame! +100";
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        } catch (err) {
            console.error("Adsgram Error:", err);
            statusMsg.style.color = "#ff4757";
            
            // Error handling
            if (err.error === 'no_fill') {
                statusMsg.innerText = "Beeksiisni amma hin jiru (No Fill).";
            } else if (err.error === 'closed') {
                statusMsg.innerText = "Beeksisa osoo hin xumurin cufte!";
            } else {
                statusMsg.innerText = "Rakkoon uumame: " + (err.error || "Unknown");
            }
        } finally {
            setTimeout(() => {
                btn.disabled = false;
                if (statusMsg.innerText !== "Milkaa'inaan xumurame! +100") {
                    statusMsg.innerText = "";
                }
            }, 3000);
        }
    }
</script>
</body>
</html>
